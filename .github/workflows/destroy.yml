name: Ação manual para destruir recursos AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente a destruir'
        required: true
        type: choice
        options:
          - hom
          - prod
      confirm:
        description: 'Digite exatamente "destroy" para confirmar a destruicao dos recursos'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    name: "Destroy AWS"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Validate confirmation input
        if: inputs.confirm != 'destroy'
        run: |
          echo "Confirmation text did not match 'destroy'. Aborting."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-pos_tech_fiap_lambda_terraform
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -backend-config=envs/${{ inputs.environment }}-backend.hcl

      - name: Terraform Workspace
        run: terraform workspace select -or-create ${{ inputs.environment }}

      - name: Show Destroy plan
        run: terraform plan -destroy -var-file=envs/${{ inputs.environment }}.tfvars

      - name: Destroy resources
        id: destroy
        run: terraform destroy -var-file=envs/${{ inputs.environment }}.tfvars -auto-approve
