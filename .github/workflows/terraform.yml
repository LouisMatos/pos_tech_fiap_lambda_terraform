name: Terraform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily drift check against hom and prod (04:00 UTC)
    - cron: '0 4 * * *'

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:

  # Static security analysis on every PR. soft_fail is false: findings block the PR.
  tfsec:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: false

  # Lambda + IAM + API Gateway sao totalmente suportados pelo LocalStack
  # Community - repo inteiro e testavel aqui, gratis, sem credencial AWS real.
  validate-localstack:
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:latest
        ports: ["4566:4566"]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform apply -var-file=envs/dev-local.tfvars -var="localstack_enabled=true" -auto-approve
      - run: terraform destroy -var-file=envs/dev-local.tfvars -var="localstack_enabled=true" -auto-approve

  # PR-only plan-and-comment jobs so reviewers see the impact before merge to main.
  plan-hom-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: hom
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-pos_tech_fiap_lambda_terraform
          aws-region: ${{ secrets.AWS_REGION }}
      - run: terraform init -backend-config=envs/hom-backend.hcl
      - run: terraform workspace select -or-create hom
      - name: Terraform validate
        run: terraform validate
      - name: Terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -no-color -var-file=envs/hom.tfvars | tee plan-hom.txt
      - name: Post plan to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan-hom -->';
            let planOutput = '(no output captured)';
            try {
              planOutput = fs.readFileSync('plan-hom.txt', 'utf8');
            } catch (e) {}
            if (planOutput.length > 60000) {
              planOutput = planOutput.slice(0, 60000) + '\n... (truncated)';
            }
            const body = `${marker}\n### Terraform Plan — hom\n\`\`\`\n${planOutput}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  plan-prod-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-pos_tech_fiap_lambda_terraform
          aws-region: ${{ secrets.AWS_REGION }}
      - run: terraform init -backend-config=envs/prod-backend.hcl
      - run: terraform workspace select -or-create prod
      - name: Terraform validate
        run: terraform validate
      - name: Terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -no-color -var-file=envs/prod.tfvars | tee plan-prod.txt
      - name: Post plan to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan-prod -->';
            let planOutput = '(no output captured)';
            try {
              planOutput = fs.readFileSync('plan-prod.txt', 'utf8');
            } catch (e) {}
            if (planOutput.length > 60000) {
              planOutput = planOutput.slice(0, 60000) + '\n... (truncated)';
            }
            const body = `${marker}\n### Terraform Plan — prod\n\`\`\`\n${planOutput}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  plan-hom:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: hom
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-pos_tech_fiap_lambda_terraform
          aws-region: ${{ secrets.AWS_REGION }}
      - run: terraform init -backend-config=envs/hom-backend.hcl
      - run: terraform workspace select -or-create hom
      - name: Terraform validate
        run: terraform validate
      - run: terraform plan -var-file=envs/hom.tfvars

  apply-hom:
    needs: plan-hom
    runs-on: ubuntu-latest
    environment: hom-apply
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-pos_tech_fiap_lambda_terraform
          aws-region: ${{ secrets.AWS_REGION }}
      - run: terraform init -backend-config=envs/hom-backend.hcl
      - run: terraform workspace select -or-create hom
      - run: terraform apply -var-file=envs/hom.tfvars -auto-approve

  plan-prod:
    needs: apply-hom
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-pos_tech_fiap_lambda_terraform
          aws-region: ${{ secrets.AWS_REGION }}
      - run: terraform init -backend-config=envs/prod-backend.hcl
      - run: terraform workspace select -or-create prod
      - name: Terraform validate
        run: terraform validate
      - run: terraform plan -var-file=envs/prod.tfvars

  apply-prod:
    needs: plan-prod
    runs-on: ubuntu-latest
    environment: prod-apply
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-pos_tech_fiap_lambda_terraform
          aws-region: ${{ secrets.AWS_REGION }}
      - run: terraform init -backend-config=envs/prod-backend.hcl
      - run: terraform workspace select -or-create prod
      - run: terraform apply -var-file=envs/prod.tfvars -auto-approve

  # Daily drift detection against hom and prod. Does not apply anything —
  # just fails loudly (exit code 2 from -detailed-exitcode) if real infra
  # has drifted from what's in state/config.
  drift-detection:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [hom, prod]
    environment: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-pos_tech_fiap_lambda_terraform
          aws-region: ${{ secrets.AWS_REGION }}
      - run: terraform init -backend-config=envs/${{ matrix.env }}-backend.hcl
      - run: terraform workspace select -or-create ${{ matrix.env }}
      - name: Detect drift
        run: terraform plan -detailed-exitcode -var-file=envs/${{ matrix.env }}.tfvars
